name: CI
on:
  pull_request:
  push:
    branches: [main, codex/technical-manual-physical-explorer]
permissions:
  contents: read
jobs:
  python:
    name: Python checks
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python: ["3.11.18", "3.12.16"]
        include:
          - os: windows-2025
            python: "3.12.10"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -c .github/ci-constraints.txt -e '.[dev]'
      - run: autonomous-eda --version
      - run: python -m autonomous_eda doctor --help
      - run: python -m autonomous_eda plan configs/gcd-sky130hd.toml
      - run: python -m autonomous_eda experiments compare --help
      - run: python -m autonomous_eda knowledge --help
      - run: python -m autonomous_eda ai --help
      - run: python -m autonomous_eda diagnose --help
      - run: python -m autonomous_eda optimize --help
      - run: python -m autonomous_eda artifacts --help
      - run: python -m autonomous_eda verify --help
      - run: python -m autonomous_eda io chip --help
      - run: python -c "import importlib.util; assert importlib.util.find_spec('mcp') is None"
      - run: pytest -q
      - run: python -m pip install -c .github/ci-constraints.txt -e '.[mcp,visuals]'
      - run: python -m pip check
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest -q
  bootstrap:
    name: Bootstrap documentation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Check bootstrap files
        run: |
          for path in README.md AGENTS.md CONTRIBUTING.md docs/{ARCHITECTURE,ROADMAP,CHANGELOG,EXPERIMENT_PROTOCOL,PROJECT_STATE,DECISIONS,MCP,KNOWLEDGE,RAG_ARCHITECTURE,RAG_BENCHMARK}.md docs/adr/0002-read-only-mcp.md .github/PULL_REQUEST_TEMPLATE.md; do
            test -s "$path" || exit 1
          done
          for path in docs/{AI_SUPERVISOR,MODEL_GATEWAY,AI_EVALUATION}.md docs/adr/0003-model-gateway-supervisor.md; do
            test -s "$path" || exit 1
          done
          for path in docs/{TIMING_DIAGNOSIS,PHYSICAL_DIAGNOSIS,DIAGNOSIS_SCHEMA,DIAGNOSIS_EVALUATION}.md; do
            test -s "$path" || exit 1
          done
          for path in docs/{OPTIMIZATION,OPTIMIZATION_POLICY,OPTIMIZATION_SCHEMA,OPTIMIZATION_EVALUATION,EXAMPLE_GALLERY,DESIGN_SYSTEM}.md; do
            test -s "$path" || exit 1
          done
