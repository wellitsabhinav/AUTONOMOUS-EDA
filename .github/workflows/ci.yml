name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  python:
    name: Python checks
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest -q
  bootstrap:
    name: Bootstrap documentation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check bootstrap files
        run: |
          for path in README.md AGENTS.md CONTRIBUTING.md docs/{ARCHITECTURE,ROADMAP,CHANGELOG,EXPERIMENT_PROTOCOL,PROJECT_STATE,DECISIONS}.md .github/PULL_REQUEST_TEMPLATE.md; do
            test -s "$path" || exit 1
          done
